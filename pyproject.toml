[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rancher-ai-chat-api"
version = "1.0.0"
description = "Flask REST API for managing chats and messages with PostgreSQL backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Francesco", email = ""}
]

dependencies = [
    "Flask[async]>=2.3.0",
    "psycopg[binary]>=3.1.0",
    "cryptography>=41.0.0",
    "httpx>=0.25.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.scripts]
rancher-ai-chat-api = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
